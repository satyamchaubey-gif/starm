{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Post New Innovation Challenge</h2>
    <p style="color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem;">Frame problem statements around measurable outcomes rather than predefined specifications.</p>
    <form method="POST">
        <div class="form-group">
            <label>Challenge Title</label>
            <input type="text" name="title" placeholder="e.g. Drone-based Crop Pest Detection System" required>
        </div>
        <div class="form-group">
            <label>Theme / Domain</label>
            <select name="theme">
                <option value="Agriculture">Agriculture</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Education">Education</option>
                <option value="Urban Governance">Urban Governance</option>
                <option value="Water Management">Water Management</option>
            </select>
        </div>
        <div class="form-group">
            <label>Problem Statement (Operational Context)</label>
            <textarea name="description" rows="4" placeholder="Detail the operational friction currently faced..." required></textarea>
        </div>
        <div class="form-group">
            <label>Expected Outcome / Success Metrics</label>
            <textarea name="expected_outcome" rows="3" placeholder="e.g. 25% reduction in pesticide usage, verified ground reports within 24h" required></textarea>
        </div>
        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label>Pilot Budget (INR)</label>
                <input type="text" name="budget" placeholder="e.g. ₹5,00,000">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Pilot Timeline</label>
                <input type="text" name="timeline" placeholder="e.g. 3 Months">
            </div>
        </div>
        <button type="submit" class="btn btn-success">Publish Challenge</button>
        <a href="{{ url_for('dept_dashboard') }}" class="btn" style="background:#a0aec0;">Cancel</a>
    </form>
</div>
{% endblock %}
